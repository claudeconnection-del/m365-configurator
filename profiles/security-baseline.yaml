# M365 Configurator — reference security baseline (v1 slice, in progress).
#
# Config-only and credential-free (ADR-0009): safe to commit and share. Authored
# in YAML; the tool treats JSON as the canonical diff form (ADR-0008). Each control
# is tagged with its framework + pinned framework version so a re-run is reproducible.
#
# This baseline grows one control at a time as the providers land (MCA-4 / MCA-5).
# Today it carries the identity ordering prerequisite, ID-1.
schemaVersion: "1.0"
name: security-baseline
framework: CISA-SCuBA
frameworkVersion: "1.5.0"
controls:
  # ID-1 — Microsoft Entra security defaults. Turned OFF because this baseline
  # ships Conditional Access policies, which are mutually exclusive with security
  # defaults; ID-1 must be off before CA enforces (the CA controls DependsOn ID-1).
  - id: ID-1
    name: Microsoft Entra security defaults
    provider: graph
    framework: Microsoft-SecurityDefaults
    frameworkVersion: "1.0"
    settings:
      isEnabled: false

  # ID-2 — Block legacy authentication (SCuBA MS.AAD.1.1v1). Legacy protocols
  # cannot do MFA; blocking them is the single highest-value CA policy.
  # state is enforced ("enabled") — the dry-run preview is the safety net.
  # excludeUsers: put your break-glass account object-id here (empty = none).
  - id: ID-2
    name: Block legacy authentication
    provider: graph
    framework: CISA-SCuBA
    frameworkVersion: "1.5.0"
    settings:
      displayName: Block legacy authentication
      state: enabled
      clientAppTypes: [exchangeActiveSync, other]
      includeUsers: [All]
      excludeUsers: []
      includeApplications: [All]
      grantOperator: OR
      grantControls: [block]

  # ID-3 — Require MFA for all users (SCuBA MS.AAD.3.2v2; CA "MFA for all
  # users" template). Highest-value identity control after blocking legacy
  # auth. Caution: an unregistered admin can lock themselves out — dry-run
  # first. excludeUsers: put your break-glass account object-id here.
  - id: ID-3
    name: Require MFA for all users
    provider: graph
    framework: CISA-SCuBA
    frameworkVersion: "1.5.0"
    settings:
      displayName: Require MFA for all users
      state: enabled
      clientAppTypes: [all]
      includeUsers: [All]
      excludeUsers: []
      includeApplications: [All]
      grantOperator: OR
      grantControls: [mfa]

  # AM-2 — Disable weak MFA methods (SCuBA MS.AAD.3.5v2). SMS, voice call, and
  # email OTP are phishable / SIM-swap-exposed; disabling them pushes users to
  # the Authenticator app or a phishing-resistant method.
  - id: AM-2
    name: Disable weak MFA methods
    provider: graph
    framework: CISA-SCuBA
    frameworkVersion: "1.5.0"
    settings:
      sms: disabled
      voice: disabled
      email: disabled

  # CON-1 — Restrict user app consent + only admins register apps (SCuBA
  # MS.AAD.5.2v1 + 5.1v1). userConsentPolicies is the
  # managePermissionGrantsForSelf.* half only; empty [] disables user consent
  # entirely (stricter SCuBA posture) — low-risk is the shipped default.
  # Set re-reads the live policy to preserve any
  # managePermissionGrantsForOwnedResource.* entries untouched.
  - id: CON-1
    name: Restrict user app consent and app registration
    provider: graph
    framework: CISA-SCuBA
    frameworkVersion: "1.5.0"
    settings:
      allowedToCreateApps: false
      userConsentPolicies: [managePermissionGrantsForSelf.microsoft-user-default-low]

  # CON-2 — Admin consent request workflow (SCuBA MS.AAD.5.3v1). Completes the
  # consent story alongside CON-1: lets a user request admin review instead of
  # being flatly blocked. The Graph update is a full-replace PUT, so every
  # field below is required.
  # !!! reviewerQueries is INTENTIONALLY EMPTY — this is a per-tenant value
  # that CANNOT ship with a real default. Set at least one reviewer
  # (/users/<object-id>) before applying: the control REFUSES to enable this
  # workflow with zero reviewers (it would silently blackhole every request).
  - id: CON-2
    name: Admin consent request workflow
    provider: graph
    framework: CISA-SCuBA
    frameworkVersion: "1.5.0"
    settings:
      isEnabled: true
      notifyReviewers: true
      remindersEnabled: true
      requestDurationInDays: 30
      reviewerQueries: []

  # SHR-1 — Restrict who can invite guests (SCuBA MS.AAD.8.2v1). Limits guest
  # invitations to admins and the Guest Inviter role. Shares the
  # authorizationPolicy singleton with CON-1 (disjoint keys — no cross-talk).
  - id: SHR-1
    name: Restrict who can invite guests
    provider: graph
    framework: CISA-SCuBA
    frameworkVersion: "1.5.0"
    settings:
      allowInvitesFrom: adminsAndGuestInviters

  # MDO-1 — Standard preset security policy (SCuBA MS.DEFENDER.1.1v1). One
  # rule toggle applies Microsoft-maintained anti-spam/anti-malware/anti-phish
  # (EOP) and Safe Links/Safe Attachments (ATP) settings. Requires the preset
  # to have been turned on once in the Defender portal — this control is not
  # self-healing (ADR-0011); see New-M365StandardPresetControl.ps1.
  - id: MDO-1
    name: Standard preset security policy
    provider: exo
    framework: CISA-SCuBA
    frameworkVersion: "1.5.0"
    settings:
      eopRuleState: Enabled
      atpRuleState: Enabled

  # MDO-4 — Block external auto-forwarding (SCuBA MS.EXO.1.1v2). External
  # auto-forwarding is a classic exfiltration vector. name: Default is the
  # well-known outbound spam filter policy every tenant ships (name-scoped;
  # an FR-7 remap target). Microsoft's docs note the tenant default
  # "Automatic" already BEHAVES as "Off" — setting Off here just makes that
  # explicit (the docs' own recommendation), it does not change behavior.
  - id: MDO-4
    name: Block external auto-forwarding
    provider: exo
    framework: CISA-SCuBA
    frameworkVersion: "1.5.0"
    settings:
      name: Default
      autoForwardingMode: "Off"

  # MDO-10 — External sender warning, native Outlook tag (SCuBA
  # MS.EXO.7.1v1). Low-friction phishing-awareness signal; no mail-flow rule
  # needed. Set-ExternalInOutlook has no -WhatIf, so the engine's own diff is
  # the entire dry-run safety net for this control (research 05 2.3).
  - id: MDO-10
    name: External sender warning (Outlook native tag)
    provider: exo
    framework: CISA-SCuBA
    frameworkVersion: "1.5.0"
    settings:
      enabled: true
      allowList: []

  # AUD-1 — Unified audit log ingestion (SCuBA MS.DEFENDER.6.1v1). The
  # prerequisite for every other audit/investigation capability. Most
  # tenants have had this on by default since 2019, so this control usually
  # plans NoChange; it exists to catch the turned-it-off case, and it is
  # NOT on by default for Business Basic/Standard/Premium licenses.
  # Enabling can take up to 60 minutes to propagate tenant-wide — apply
  # reports the write outcome, not an immediate re-verification.
  - id: AUD-1
    name: Unified audit log ingestion
    provider: exo
    framework: CISA-SCuBA
    frameworkVersion: "1.5.0"
    settings:
      unifiedAuditLogIngestionEnabled: true
