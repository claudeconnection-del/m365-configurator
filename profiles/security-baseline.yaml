# M365 Configurator — reference security baseline (v1 slice, in progress).
#
# Config-only and credential-free (ADR-0009): safe to commit and share. Authored
# in YAML; the tool treats JSON as the canonical diff form (ADR-0008). Each control
# is tagged with its framework + pinned framework version so a re-run is reproducible.
#
# This baseline grows one control at a time as the providers land (MCA-4 / MCA-5).
# Today it carries the identity ordering prerequisite, ID-1.
schemaVersion: "1.0"
name: security-baseline
framework: CISA-SCuBA
frameworkVersion: "1.5.0"
controls:
  # ID-1 — Microsoft Entra security defaults. Turned OFF because this baseline
  # ships Conditional Access policies, which are mutually exclusive with security
  # defaults; ID-1 must be off before CA enforces (the CA controls DependsOn ID-1).
  - id: ID-1
    name: Microsoft Entra security defaults
    provider: graph
    framework: Microsoft-SecurityDefaults
    frameworkVersion: "1.0"
    settings:
      isEnabled: false

  # ID-2 — Block legacy authentication (SCuBA MS.AAD.1.1v1). Legacy protocols
  # cannot do MFA; blocking them is the single highest-value CA policy.
  # state is enforced ("enabled") — the dry-run preview is the safety net.
  # excludeUsers: put your break-glass account object-id here (empty = none).
  - id: ID-2
    name: Block legacy authentication
    provider: graph
    framework: CISA-SCuBA
    frameworkVersion: "1.5.0"
    settings:
      displayName: Block legacy authentication
      state: enabled
      clientAppTypes: [exchangeActiveSync, other]
      includeUsers: [All]
      excludeUsers: []
      includeApplications: [All]
      grantOperator: OR
      grantControls: [block]

  # ID-3 — Require MFA for all users (SCuBA MS.AAD.3.2v2; CA "MFA for all
  # users" template). Highest-value identity control after blocking legacy
  # auth. Caution: an unregistered admin can lock themselves out — dry-run
  # first. excludeUsers: put your break-glass account object-id here.
  - id: ID-3
    name: Require MFA for all users
    provider: graph
    framework: CISA-SCuBA
    frameworkVersion: "1.5.0"
    settings:
      displayName: Require MFA for all users
      state: enabled
      clientAppTypes: [all]
      includeUsers: [All]
      excludeUsers: []
      includeApplications: [All]
      grantOperator: OR
      grantControls: [mfa]

  # AM-2 — Disable weak MFA methods (SCuBA MS.AAD.3.5v2). SMS, voice call, and
  # email OTP are phishable / SIM-swap-exposed; disabling them pushes users to
  # the Authenticator app or a phishing-resistant method.
  - id: AM-2
    name: Disable weak MFA methods
    provider: graph
    framework: CISA-SCuBA
    frameworkVersion: "1.5.0"
    settings:
      sms: disabled
      voice: disabled
      email: disabled

  # CON-1 — Restrict user app consent + only admins register apps (SCuBA
  # MS.AAD.5.2v1 + 5.1v1). userConsentPolicies is the
  # managePermissionGrantsForSelf.* half only; empty [] disables user consent
  # entirely (stricter SCuBA posture) — low-risk is the shipped default.
  # Set re-reads the live policy to preserve any
  # managePermissionGrantsForOwnedResource.* entries untouched.
  - id: CON-1
    name: Restrict user app consent and app registration
    provider: graph
    framework: CISA-SCuBA
    frameworkVersion: "1.5.0"
    settings:
      allowedToCreateApps: false
      userConsentPolicies: [managePermissionGrantsForSelf.microsoft-user-default-low]
